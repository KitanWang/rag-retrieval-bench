# 默认配置：CPU 可跑的最小实验规模
# 改这里而不是改代码；命令行可用 --config 覆盖整份配置

data:
  hf_dataset: C-MTEB/DuRetrieval
  hf_qrels_dataset: C-MTEB/DuRetrieval-qrels
  corpus_size: 20000
  query_size: 300
  seed: 42

retriever:
  # CPU 友好：BGE-small-zh 在 20k 语料上约 10 分钟编码完
  # （BGE-M3 在纯 CPU 上实测 0.7 docs/s，同等规模要 7 小时以上，已记录在报告中）
  embed_model: BAAI/bge-small-zh-v1.5
  embed_batch_size: 32
  rerank_model: BAAI/bge-reranker-base
  rerank_batch_size: 16
  rerank_top_k: 50
  # 向量后端：faiss（本地高性能）/ milvus（与生产同 SDK，单文件模式在 CPU 上很慢）
  vector_backend: faiss
  index_type: HNSW
  bm25_k1: 0.9
  bm25_b: 0.4
  fusion: rrf
  rrf_k: 60

eval:
  top_ks: [1, 5, 10]
  main_k: 5
  gen_sample_size: 60
  gen_top_k: 5

router:
  long_query_chars: 14
  code_like_ratio: 0.15
  rerank_gap: 0.55
  # 升级重排时送多少候选给 cross-encoder。
  # **必须与 retriever.rerank_top_k 一致**，否则 router 与 hybrid_rerank 的
  # 「质量」和「延迟」都不是在同一条件下比较的——早期设成 10，
  # 导致 router 只重排 10 篇，延迟看起来比 hybrid_rerank（重排 50 篇）低 5 倍，
  # 但那不是路由省下来的，是少干活换来的，质量自然也更差。
  rerank_candidates: 50
