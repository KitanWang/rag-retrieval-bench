name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv
        run: uv venv --python ${{ matrix.python-version }}

      # 只装轻量依赖：单测不需要 torch / sentence-transformers
      - name: Install dependencies
        run: |
          uv pip install numpy pandas pyarrow PyYAML requests jieba pytest ruff
          uv pip install -e . --no-deps

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Run tests
        run: uv run pytest tests -q

      - name: 冒烟检查脚本可解析（不跑模型）
        run: |
          # 评测脚本依赖 torch/faiss，CI 里只做语法与导入检查，
          # 避免因为本地改了 API 却忘记同步到脚本（这类问题只在别人复现时才暴露）
          for f in scripts/*.py; do
            uv run python -c "import ast,sys; ast.parse(open('$f').read())" || exit 1
          done
          echo "所有 scripts/*.py 语法检查通过"
