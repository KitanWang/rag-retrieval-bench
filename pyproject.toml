[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-retrieval-bench"
version = "0.1.0"
description = "中文 RAG 检索策略对比基准：朴素向量 / BM25 / 混合检索 / 重排 / 策略路由"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "jieba>=0.42",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8",
    "pymilvus[milvus_lite]>=2.4",
]

[project.optional-dependencies]
embed = [
    "torch>=2.4",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
